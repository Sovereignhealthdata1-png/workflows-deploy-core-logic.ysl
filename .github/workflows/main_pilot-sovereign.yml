name: Deploy Python and C# Apps
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # Required for Azure OIDC authentication
  contents: read  # Required for actions/checkout

jobs:
  # ========================================================
  # JOB 1: Build and Deploy C# Core Logic
  # ========================================================
  deploy-csharp:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup .NET SDK'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 'Build and Publish C# Project'
        run: |
          dotnet publish core-logic/Platform.Verification.csproj --configuration Release --output ./cs-output

      - name: 'Azure Login via OIDC'
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: 'Deploy C# to Azure Function'
        uses: azure/functions-action@v1
        with:
          app-name: 'pilot-sovereign'
          package: './cs-output'

  # ========================================================
  # JOB 2: Build and Deploy Python App
  # ========================================================
  deploy-python:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup Python Environment'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Adjust to your target Python version

      - name: 'Install Python Dependencies'
        run: |
          python -m pip install --upgrade pip
          # If your python app is in a subdirectory, cd into it first:
          # cd python-app && pip install -r requirements.txt --target=".python_packages"
          pip install -r requirements.txt --target=".python_packages"

      - name: 'Azure Login via OIDC'
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID}}

      - name: 'Deploy Python to Azure Function'
        uses: azure/functions-action@v1
        with:
          app-name: 'pilot-sovereign-python' # Update to your Python Function App name
          package: '.' # Adjust if your python code lives in a specific subfolder
